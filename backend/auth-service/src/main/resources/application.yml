server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: auth-service
  config:
    import: "optional:file:../../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
management:
  endpoints:
    web:
      exposure:
        include: health,info
